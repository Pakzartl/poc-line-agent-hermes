services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    container_name: poc-line-agent-hermes
    platform: linux/amd64
    restart: unless-stopped
    command:
      - /opt/hermes/.venv/bin/hermes
      - gateway
      - run
    env_file:
      - path: ./env.local
        required: false
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      POC_LINE_AGENT_SKILLS_DIR: /opt/poc-line-agent-skills
    ports:
      - "127.0.0.1:8642:8642"
    volumes:
      - /srv/hermes/data:/opt/data
      - ./config.template.yaml:/opt/data/config.yaml:ro
      - ./plugins:/opt/data/plugins:ro
      - ./skills:/opt/poc-line-agent-skills:ro
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8642/health', timeout=5).read()\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  discord-gateway:
    build:
      context: ./discord-gateway
    container_name: poc-line-agent-discord-gateway
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - path: ./env.local
        required: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  capability-adapter:
    build:
      context: ./capability-adapter
    container_name: poc-line-agent-capability-adapter
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - path: ./env.local
        required: false
    environment:
      CAPABILITY_ADAPTER_PORT: "8788"
    ports:
      - "127.0.0.1:8788:8788"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8788/health'); if(!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db-adapter:
    profiles:
      - db
    build:
      context: ./db-adapter
    container_name: poc-line-agent-db-adapter
    platform: linux/amd64
    restart: unless-stopped
    env_file:
      - path: ./env.local
        required: false
    environment:
      DB_ADAPTER_PORT: "8789"
    ports:
      - "127.0.0.1:8789:8789"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:8789/health'); if(!r.ok) process.exit(1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
